<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>Apostolic Message</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #111827;
            color: #f9fafb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 2rem 1rem;
        }

        main {
            width: min(100%, 48rem);
        }

        h1, .intro {
            text-align: center;
        }

        h1 {
            margin-bottom: 0.5rem;
            font-family: Georgia, serif;
            font-size: clamp(2rem, 8vw, 3.5rem);
        }

        .intro {
            margin: 0 0 2rem;
            color: #cbd5e1;
            font-size: 1.1rem;
        }

        .sites {
            display: grid;
            gap: 1rem;
        }

        .site-link {
            display: block;
            padding: 1.5rem;
            border: 1px solid #475569;
            border-radius: 1rem;
            background: #1f2937;
            color: inherit;
            text-decoration: none;
            transition: border-color 150ms ease, transform 150ms ease;
        }

        .site-link:hover, .site-link:focus-visible {
            border-color: #fbbf24;
            transform: translateY(-2px);
        }

        .site-link h2 {
            margin: 0 0 0.5rem;
            color: #fde68a;
            font-size: 1.35rem;
        }

        .site-link p {
            margin: 0;
            color: #d1d5db;
            line-height: 1.5;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Apostolic Message</h1>
        <p class="intro">Choose a collection to explore.</p>
        <nav class="sites" aria-label="Websites">
            <a class="site-link" href="Apostolic%20Quotes%20(By%20AI)/index.html">
                <h2>Apostolic Quotes</h2>
                <p>Explore scripture and testimonies from the apostles.</p>
            </a>
            <a class="site-link" href="My%20Version/index.html">
                <h2>My Version</h2>
                <p>Browse the original verse collection.</p>
            </a>
        </nav>
    </main>
</body>
</html>
